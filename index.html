<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xếp ảnh 3×4 lên giấy A4</title>
<style>
  :root { --ink:#1d2a38; --muted:#6b7785; --line:#dde3ea; --accent:#1f4e79; --bg:#eef2f6; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Segoe UI", Roboto, Arial, sans-serif; color:var(--ink); background:var(--bg); }
  header { position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line); padding:14px 18px; box-shadow:0 2px 8px rgba(0,0,0,.04); }
  h1 { font-size:1.1rem; margin:0 0 12px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:flex-end; }
  .field { display:flex; flex-direction:column; gap:4px; font-size:.8rem; color:var(--muted); }
  .field input[type=number], .field select { font:inherit; font-size:.95rem; padding:6px 8px; border:1px solid #c9d2dc; border-radius:6px; background:#fff; color:var(--ink); width:96px; }
  .field select { width:auto; min-width:200px; }
  .field input:disabled { background:#f3f5f8; color:#9aa5b1; }
  .check { flex-direction:row; align-items:center; gap:6px; color:var(--ink); font-size:.92rem; padding-bottom:6px; }
  .btn { font:inherit; font-weight:600; font-size:.92rem; padding:9px 14px; border-radius:8px; border:0; cursor:pointer; background:var(--accent); color:#fff; }
  .btn.ghost { background:#fff; color:var(--accent); border:1px solid #b9c7d6; }
  .btn:disabled { background:#b7c2cf; cursor:not-allowed; }
  .info { margin-top:12px; font-size:.9rem; color:var(--muted); line-height:1.5; }
  .info b { color:var(--ink); }
  .note { margin-top:8px; font-size:.86rem; border-radius:6px; padding:6px 10px; display:none; }
  .note.show { display:block; }
  .note.warn { color:#8a5300; background:#fff6e5; border:1px solid #f1d7a6; }
  .note.info { color:#1f4e79; background:#eaf2fb; border:1px solid #c5daf0; }
  .privacy { margin-top:8px; font-size:.82rem; color:#2f7d4f; }
  main { padding:20px; display:flex; justify-content:center; }
  #preview { zoom:0.6; display:flex; flex-direction:column; align-items:center; gap:24px; }
  .empty { color:var(--muted); padding:60px 20px; text-align:center; background:#fff; border:1px dashed #b9c7d6; border-radius:10px; width:min(560px, 90vw); line-height:1.6; }
  .page { position:relative; flex:none; width:21cm; height:29.7cm; background:#fff; box-shadow:0 4px 18px rgba(0,0,0,.12); overflow:hidden; }
  .cell { position:absolute; overflow:hidden; background:#f4f6f8; }
  .cell.cut { outline:0.02cm dashed #7b8794; outline-offset:0; }
  .cell img { display:block; width:100%; height:100%; image-orientation:from-image; }
  .cell img.cover { object-fit:cover; object-position:50% 40%; }
  .cell img.contain { object-fit:contain; background:#fff; }
  @page { size:A4 portrait; margin:0; }
  @media print {
    body { background:#fff; }
    header, .noprint { display:none !important; }
    main { padding:0; display:block; }
    #preview { zoom:1 !important; gap:0; align-items:flex-start; }
    .page { box-shadow:none; break-after:page; }
    .page:last-child { break-after:auto; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>
<header>
  <h1>Xếp ảnh 3×4 lên giấy A4 để in và cắt</h1>
  <div class="controls">
    <div class="field">
      <span>Ảnh</span>
      <button class="btn" id="pickFolder" type="button">📁 Chọn thư mục ảnh</button>
    </div>
    <div class="field">
      <span>Cỡ ảnh (cm)</span>
      <div style="display:flex;gap:6px;align-items:center">
        <input id="pw" type="number" step="0.1" min="0.5" value="3"> ×
        <input id="ph" type="number" step="0.1" min="0.5" value="4">
      </div>
    </div>
    <div class="field">
      <span>Khoảng cách giữa ảnh (cm)</span>
      <input id="gap" type="number" step="0.1" min="0" value="0.5">
    </div>
    <div class="field">
      <span>Lề giấy (cm)</span>
      <input id="margin" type="number" step="0.1" min="0" value="1">
    </div>
    <div class="field">
      <span>Cách xếp</span>
      <select id="mode">
        <option value="auto">Tự động: xếp nhiều nhất, căn đều</option>
        <option value="fixed">Cố định số cột × hàng</option>
      </select>
    </div>
    <div class="field">
      <span>Cột × hàng</span>
      <div style="display:flex;gap:6px;align-items:center">
        <input id="cols" type="number" min="1" step="1" value="3" disabled> ×
        <input id="rows" type="number" min="1" step="1" value="4" disabled>
      </div>
    </div>
    <div class="field">
      <span>Kiểu ảnh</span>
      <select id="fit">
        <option value="cover">Lấp đầy khung (cắt bớt mép nếu lệch tỉ lệ)</option>
        <option value="contain">Giữ nguyên toàn ảnh (có viền trắng)</option>
      </select>
    </div>
    <label class="field check"><input id="cuts" type="checkbox" checked> Vẽ đường cắt</label>
    <div class="field">
      <span>Phóng to xem: <b id="zoomVal">60</b>%</span>
      <input id="zoom" type="range" min="30" max="100" value="60">
    </div>
    <button class="btn ghost" id="pickFiles" type="button">Chọn nhiều ảnh</button>
    <button class="btn ghost" id="clearBtn" type="button">Xóa</button>
    <button class="btn" id="printBtn" type="button" disabled>🖨 In</button>
    <input id="folder" type="file" webkitdirectory directory multiple accept="image/*" hidden>
    <input id="files" type="file" multiple accept="image/*" hidden>
  </div>
  <div class="info" id="summary"></div>
  <div class="note warn" id="warn"></div>
  <div class="note warn" id="ratio"></div>
  <div class="note warn" id="skipped"></div>
  <div class="note info show">In bằng <b>khổ A4</b>, tỉ lệ <b>100%</b> (không chọn “Vừa với trang”), lề <b>không</b> (None). Ảnh chỉ được xử lý trên máy bạn, không tải lên đâu cả.</div>
</header>
<main>
  <div id="preview"></div>
</main>

<script>
const A4W = 21, A4H = 29.7;                       // cm
const $ = id => document.getElementById(id);
const IMG_RE = /\.(jpe?g|png|webp|gif|bmp)$/i;
const HEIC_RE = /\.(heic|heif)$/i;
const collator = new Intl.Collator('vi', { numeric: true, sensitivity: 'base' });
let items = [];        // {name, url}
let skipped = [];      // tên file HEIC (trình duyệt không hiển thị được)

function num(id, d) { const v = parseFloat($(id).value); return Number.isFinite(v) && v >= 0 ? v : d; }

function setFiles(list) {
  items.forEach(it => URL.revokeObjectURL(it.url));
  const all = [...list];
  skipped = all.filter(f => HEIC_RE.test(f.name)).map(f => f.name);
  items = all
    .filter(f => IMG_RE.test(f.name) && !f.name.startsWith('.'))
    .sort((a, b) => collator.compare(a.name, b.name))
    .map(f => ({ name: f.name, url: URL.createObjectURL(f) }));
  render();
}

// Tính lưới: căn giữa để phần trống hai bên (và trên, dưới) bằng nhau
function layout() {
  const pw = num('pw', 3), ph = num('ph', 4), gap = num('gap', 0.5), m = num('margin', 1);
  const availW = A4W - 2 * m, availH = A4H - 2 * m;
  let cols, rows;
  if ($('mode').value === 'fixed') {
    cols = Math.max(1, Math.floor(num('cols', 3)));
    rows = Math.max(1, Math.floor(num('rows', 4)));
  } else {
    cols = Math.max(1, Math.floor((availW + gap) / (pw + gap) + 1e-9));
    rows = Math.max(1, Math.floor((availH + gap) / (ph + gap) + 1e-9));
  }
  const gridW = cols * pw + (cols - 1) * gap, gridH = rows * ph + (rows - 1) * gap;
  const overflow = gridW > availW + 1e-6 || gridH > availH + 1e-6;
  return {
    pw, ph, gap, cols, rows, per: cols * rows,
    x0: m + (availW - gridW) / 2, y0: m + (availH - gridH) / 2,
    warn: overflow ? `Lưới ${cols} × ${rows} không vừa trang A4 với lề ${m} cm. Hãy giảm số cột/hàng, cỡ ảnh, khoảng cách hoặc lề.` : ''
  };
}

function render() {
  const L = layout();
  const pv = $('preview');
  pv.innerHTML = '';
  $('printBtn').disabled = items.length === 0;
  $('warn').textContent = L.warn; $('warn').classList.toggle('show', !!L.warn);
  $('skipped').textContent = skipped.length ? `Bỏ qua ${skipped.length} file HEIC (trình duyệt không xem được, hãy đổi sang JPG).` : '';
  $('skipped').classList.toggle('show', skipped.length > 0);
  if (!items.length) {
    pv.innerHTML = '<p class="empty">Chưa có ảnh nào.<br>Bấm <b>“Chọn thư mục ảnh”</b> rồi chọn thư mục chứa ảnh của bạn.</p>';
    $('summary').innerHTML = '';
    updateRatio();
    return;
  }
  const pages = Math.ceil(items.length / L.per);
  const frag = document.createDocumentFragment();
  for (let p = 0; p < pages; p++) {
    const sec = document.createElement('section');
    sec.className = 'page';
    for (let k = 0; k < L.per && p * L.per + k < items.length; k++) {
      const it = items[p * L.per + k];
      const c = k % L.cols, r = Math.floor(k / L.cols);
      const cell = document.createElement('div');
      cell.className = 'cell' + ($('cuts').checked ? ' cut' : '');
      Object.assign(cell.style, {
        left: (L.x0 + c * (L.pw + L.gap)) + 'cm',
        top: (L.y0 + r * (L.ph + L.gap)) + 'cm',
        width: L.pw + 'cm', height: L.ph + 'cm'
      });
      const img = new Image();
      img.src = it.url; img.alt = it.name; img.className = $('fit').value;
      img.addEventListener('load', updateRatio);
      cell.appendChild(img);
      sec.appendChild(cell);
    }
    frag.appendChild(sec);
  }
  pv.appendChild(frag);
  $('summary').innerHTML = `Tìm thấy <b>${items.length}</b> ảnh → <b>${pages}</b> trang A4 · mỗi trang <b>${L.cols} × ${L.rows}</b> = ${L.per} ảnh · cỡ ${L.pw} × ${L.ph} cm`;
  updateRatio();
}

// Cảnh báo ảnh lệch tỉ lệ khi chọn "Lấp đầy khung" (mép sẽ bị cắt)
function updateRatio() {
  const el = $('ratio');
  if (!items.length || $('fit').value !== 'cover') { el.classList.remove('show'); return; }
  const L = layout(), want = L.pw / L.ph;
  const imgs = [...document.querySelectorAll('#preview img')].filter(i => i.naturalWidth);
  const bad = imgs.filter(i => Math.abs(i.naturalWidth / i.naturalHeight - want) / want > 0.03).length;
  el.textContent = bad ? `${bad} ảnh không đúng tỉ lệ ${L.pw}:${L.ph}, phần mép sẽ bị cắt bớt. Muốn giữ đủ ảnh, chọn “Giữ nguyên toàn ảnh”.` : '';
  el.classList.toggle('show', bad > 0);
}

function syncFields() {
  const fixed = $('mode').value === 'fixed';
  $('cols').disabled = !fixed; $('rows').disabled = !fixed;
}

function clearAll() {
  items.forEach(it => URL.revokeObjectURL(it.url));
  items = []; skipped = [];
  render();
}

$('pickFolder').addEventListener('click', () => $('folder').click());
$('pickFiles').addEventListener('click', () => $('files').click());
$('folder').addEventListener('change', e => { setFiles(e.target.files); e.target.value = ''; });
$('files').addEventListener('change', e => { setFiles(e.target.files); e.target.value = ''; });
$('clearBtn').addEventListener('click', clearAll);
$('printBtn').addEventListener('click', () => window.print());
['pw', 'ph', 'gap', 'margin', 'cols', 'rows'].forEach(id => $(id).addEventListener('input', render));
['mode', 'fit', 'cuts'].forEach(id => $(id).addEventListener('change', () => { syncFields(); render(); }));
$('zoom').addEventListener('input', () => {
  $('zoomVal').textContent = $('zoom').value;
  $('preview').style.zoom = $('zoom').value / 100;
});
$('preview').style.zoom = $('zoom').value / 100;
syncFields();
render();
</script>
</body>
</html>
